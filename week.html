<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<title>This Week</title>
<style>
  :root{
    --bg:#f1f2f4; --card:#ffffff; --card2:#f4f5f7; --line:#e4e6ea;
    --text:#1b1d22; --dim:#73767e; --faint:#a6a9b0;
    --orange:#fc4c02; --orange-soft:rgba(252,76,2,.10);
    --green:#1aa463; --green-soft:rgba(26,164,99,.12);
    --amber:#e08a00; --purple:#6d56e0; --blue:#2f6fed;
    --shadow:0 1px 2px rgba(20,22,28,.06), 0 1px 8px rgba(20,22,28,.04);
    --shadow-lg:0 4px 18px rgba(20,22,28,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#171b22; --card2:#1f242e; --line:#2a313d;
      --text:#eaeef3; --dim:#8b95a5; --faint:#5b6473;
      --orange:#ff5b1f; --orange-soft:rgba(255,91,31,.16);
      --green:#3ecf8e; --green-soft:rgba(62,207,142,.16);
      --amber:#f5b14d; --purple:#a78bfa; --blue:#5b9bff;
      --shadow:none; --shadow-lg:0 6px 22px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:88px; -webkit-font-smoothing:antialiased}
  .lbl{font-size:11px; font-weight:800; letter-spacing:.10em; text-transform:uppercase}

  /* Top bar */
  .topbar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line);
    padding:10px 14px calc(10px); display:flex; align-items:center; gap:12px}
  .topbar .brand{flex:1; min-width:0}
  .topbar .brand .t{font-size:16px; font-weight:800; letter-spacing:-.01em}
  .topbar .brand .s{font-size:12px; color:var(--dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* Weight chip */
  .wchip{display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--line);
    border-radius:12px; padding:7px 10px; text-decoration:none; color:var(--text); min-width:0}
  .wchip .wval{font-size:15px; font-weight:800; line-height:1}
  .wchip .wunit{font-size:10px; color:var(--dim); font-weight:600}
  .wchip .wmeta{display:flex; flex-direction:column; align-items:flex-start; gap:2px}
  .wchip .wtrend{font-size:10px; font-weight:700; line-height:1}
  .wchip .wtrend.down{color:var(--green)} .wchip .wtrend.up{color:var(--amber)} .wchip .wtrend.flat{color:var(--dim)}
  .wchip svg{display:block}

  /* Day tabs */
  .tabs{display:flex; gap:7px; overflow-x:auto; padding:11px 14px; background:var(--bg);
    position:sticky; top:53px; z-index:15; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; min-width:50px; padding:7px 11px; border-radius:12px; background:var(--card);
    border:1px solid var(--line); color:var(--dim); text-align:center; box-shadow:var(--shadow)}
  .tab .dn{font-weight:800; font-size:13px; display:block; letter-spacing:.02em}
  .tab .dt{font-size:10px; color:var(--faint)}
  .tab.active{background:var(--orange); border-color:var(--orange); color:#fff}
  .tab.active .dt{color:rgba(255,255,255,.85)}
  .tab .ring{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--line); margin-top:3px}
  .tab.done .ring{background:var(--green)}
  .tab.active .ring{background:rgba(255,255,255,.9)}

  .wrap{padding:0 14px}

  /* Activity header (Strava-style) */
  .ahead{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:16px; margin-bottom:12px; position:relative; overflow:hidden}
  .ahead .kind{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase; color:var(--orange)}
  .ahead .kind .ico{width:18px; height:18px; border-radius:6px; background:var(--orange-soft);
    display:flex; align-items:center; justify-content:center; font-size:12px}
  .ahead h1{margin:6px 0 2px; font-size:23px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .ahead .when{font-size:13px; color:var(--dim)}
  .ahead .desc{font-size:14px; color:var(--dim); line-height:1.5; margin-top:10px}
  .stats{display:flex; gap:0; margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .stat{flex:1; text-align:left; padding-right:12px; position:relative}
  .stat + .stat{border-left:1px solid var(--line); padding-left:12px}
  .stat .v{font-size:20px; font-weight:800; letter-spacing:-.02em}
  .stat .v small{font-size:12px; color:var(--dim); font-weight:700}
  .stat .k{font-size:10px; color:var(--dim); font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-top:2px}
  /* Overall progress bar */
  .pbar{height:6px; background:var(--card2); border-radius:99px; overflow:hidden; margin-top:14px}
  .pbar > span{display:block; height:100%; background:linear-gradient(90deg,var(--orange),#ff7a3c); border-radius:99px; transition:width .35s ease}
  .pbar.full > span{background:linear-gradient(90deg,var(--green),#46d99b)}
  .pcap{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--dim); font-weight:600}

  /* Phase flow stepper */
  .flow{display:flex; gap:6px; margin-bottom:12px}
  .flow .step{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 8px;
    box-shadow:var(--shadow); text-align:center}
  .flow .step .ph{font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--dim)}
  .flow .step .ct{font-size:13px; font-weight:800; margin-top:2px; color:var(--text)}
  .flow .step.active{border-color:var(--orange)}
  .flow .step.active .ph{color:var(--orange)}
  .flow .step.done{border-color:var(--green); background:var(--green-soft)}
  .flow .step.done .ph{color:var(--green)}
  .flow .step.done .ct::after{content:" ✓"}

  /* Section labels within a session */
  .seclabel{display:flex; align-items:center; gap:8px; margin:18px 2px 8px}
  .seclabel .txt{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
  .seclabel .cnt{font-size:11px; color:var(--dim); font-weight:700}
  .seclabel.warm .txt{color:var(--amber)}
  .seclabel.work .txt{color:var(--orange)}
  .seclabel.core .txt{color:var(--purple)}
  .seclabel.cool .txt{color:var(--blue)}
  .seclabel .bar{flex:1; height:1px; background:var(--line)}

  /* Cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:13px; margin-bottom:10px}
  .ex .top{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
  .ex .name{font-weight:800; font-size:16px; letter-spacing:-.01em}
  .ex .scheme{font-size:12px; color:var(--orange); font-weight:800; white-space:nowrap}
  .ex .note{color:var(--dim); font-size:12.5px; margin-top:3px; line-height:1.4}
  .nameinput{font-weight:800; font-size:16px; border:none; background:transparent; color:var(--text); width:100%; padding:0; outline:none; border-bottom:1px dashed var(--line)}
  .nameinput::placeholder{color:var(--faint)}

  .setrow{display:flex; align-items:center; gap:10px; margin-top:9px}
  .chk{width:30px; height:30px; border-radius:9px; border:2px solid var(--line); background:var(--card2);
    flex:0 0 30px; display:flex; align-items:center; justify-content:center; font-size:15px; color:transparent; transition:.12s}
  .chk.on{background:var(--green); border-color:var(--green); color:#fff}
  .setrow .slbl{font-size:12px; color:var(--dim); width:46px; font-weight:700}
  .setrow .ilbl{font-size:13.5px; color:var(--text); flex:1; line-height:1.35}
  .setrow .ilbl.dim{color:var(--dim)}
  input[type=text],input[type=number]{background:var(--card2); border:1px solid var(--line); border-radius:9px;
    color:var(--text); padding:8px 10px; font-size:16px; width:100%; outline:none}
  input:focus{border-color:var(--orange)}
  .setrow .ni{width:74px; flex:0 0 74px} .unit{font-size:11px; color:var(--dim); font-weight:700}
  .setminis{display:flex; gap:8px; margin-top:9px}
  .minibtn{font-size:12px; font-weight:700; color:var(--dim); background:var(--card2); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px}
  .minibtn.warn{color:var(--orange)}

  .fieldrow{display:flex; align-items:center; gap:10px; margin-top:9px}
  .fieldrow .flbl{font-size:13px; color:var(--dim); width:108px; flex:0 0 108px; font-weight:600}
  .bigdone{width:100%; margin-top:13px; padding:13px; border-radius:12px; border:none; background:var(--card2);
    color:var(--text); font-size:15px; font-weight:800}
  .bigdone.on{background:var(--green); color:#fff}

  .addex{width:100%; margin-top:4px; padding:11px; border-radius:12px; border:1.5px dashed var(--line);
    background:transparent; color:var(--dim); font-size:14px; font-weight:700}
  .addex:active{border-color:var(--orange); color:var(--orange)}

  /* Extra workout block */
  .extra-head{display:flex; align-items:center; justify-content:space-between; margin:22px 2px 4px}
  .extra-head .et{font-size:13px; font-weight:800; color:var(--text)}
  .extra-head .rm{font-size:12px; font-weight:700; color:var(--dim); background:none; border:none; padding:4px 6px}
  .addworkout-wrap{margin:8px 0 4px}
  .addworkout{width:100%; padding:13px; border-radius:13px; border:1.5px dashed var(--line); background:var(--card);
    color:var(--orange); font-size:14.5px; font-weight:800; box-shadow:var(--shadow)}
  .picker{display:flex; gap:8px; margin-top:8px}
  .picker button{flex:1; padding:13px 8px; border-radius:13px; border:1px solid var(--line); background:var(--card);
    color:var(--text); font-size:14px; font-weight:800; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:4px}
  .picker button .pi{font-size:20px}
  .picker .cancel{flex:0 0 auto; color:var(--dim); font-weight:700}

  /* Journal */
  .jr{margin-top:18px}
  .feel{display:flex; gap:7px; margin-top:8px}
  .feel button{flex:1; padding:11px 0; border-radius:11px; border:1px solid var(--line); background:var(--card);
    color:var(--dim); font-size:13px; font-weight:700; box-shadow:var(--shadow)}
  .feel button.on{background:var(--orange); color:#fff; border-color:var(--orange)}
  textarea{margin-top:9px; min-height:80px; resize:vertical; background:var(--card); border:1px solid var(--line);
    border-radius:12px; color:var(--text); padding:11px; font-size:15px; width:100%; outline:none; box-shadow:var(--shadow); font-family:inherit; line-height:1.5}
  textarea:focus{border-color:var(--orange)}

  footer{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:20}
  footer button{flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:800}
  #exportBtn{background:var(--orange); color:#fff}
  #copyBtn{background:var(--card2); color:var(--text); border:1px solid var(--line)}
  .toast{position:fixed; bottom:84px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--card);
    padding:10px 16px; border-radius:11px; font-size:14px; font-weight:700; opacity:0; transition:opacity .25s;
    pointer-events:none; z-index:30; box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="t" id="hTitle">This Week</div>
    <div class="s" id="hSub"></div>
  </div>
  <a class="wchip" id="wchip" href="/weight">
    <div class="wmeta">
      <div><span class="wval" id="wval">—</span> <span class="wunit">lb</span></div>
      <div class="wtrend flat" id="wtrend">Weight</div>
    </div>
    <span id="wspark"></span>
  </a>
</div>

<div class="tabs" id="tabs"></div>
<div class="wrap" id="content"></div>

<footer>
  <button id="copyBtn">Copy log</button>
  <button id="exportBtn">Export log</button>
</footer>
<div class="toast" id="toast"></div>

<script>
// ======================= WEEK PLAN (regenerated each Sunday) =======================
const PLAN = {
  weekId: "2026-06-15",
  start: "2026-06-15",
  title: "Week of June 15–21",
  subtitle: "Calibration Week — log weights at RPE 7 to set baselines",
  days: [
    {d:"Mon", date:"6/15", name:"Lower — Squat Focus", block:"5:30–7:30 PM", dur:"1 hr work", type:"lift",
      warmup:["2–3 min on rower, stairmaster, or erg — easy pace","Leg swings — 10 each direction/leg","Bodyweight squats — 1×15"],
      items:[
        {n:"Back Squat", s:4, r:"5", note:"RPE 7 — work up, log top weight"},
        {n:"Romanian Deadlift", s:3, r:"8", note:"RPE 7"},
        {n:"Walking Lunges", s:3, r:"10/leg"},
        {n:"Leg Curl", s:3, r:"12"},
        {n:"Standing Calf Raise", s:3, r:"15"},
        {n:"Dead Bug", s:2, r:"10/side", noWeight:true, coreStart:true},
        {n:"Hollow Body Hold", s:2, r:"30s", noWeight:true},
        {n:"Russian Twist", s:2, r:"20", noWeight:true}
      ],
      stretches:[
        "Hip flexor stretch — 30s each side",
        "Ankle circles — 10 each direction",
        "Glute / figure-4 stretch — 30s each side"
      ]},
    {d:"Tue", date:"6/16", name:"Easy Run", block:"5:30–7:30 PM", dur:"35–40 min", type:"cardio",
      desc:"35–40 min conversational pace. Keep it genuinely easy — building back.",
      fields:["Distance (mi)","Time","Avg HR"]},
    {d:"Wed", date:"6/17", name:"Upper — Press Focus", block:"5:30–7:30 PM", dur:"1 hr work", type:"lift",
      warmup:["2–3 min on rower, stairmaster, or erg — easy pace","Band pull-aparts — 1×20","Arm circles + shoulder dislocates — 10 each"],
      items:[
        {n:"Bench Press", s:4, r:"5", note:"RPE 7 — log top weight"},
        {n:"Overhead Press", s:3, r:"8", note:"RPE 7"},
        {n:"Barbell Row", s:4, r:"8"},
        {n:"Lat Pulldown", s:3, r:"10"},
        {n:"Pushdown + Curl superset", s:3, r:"12 each"},
        {n:"Ab Wheel Rollout", s:2, r:"8", noWeight:true, coreStart:true},
        {n:"Side Plank", s:2, r:"30s/side", noWeight:true},
        {n:"Bicycle Crunch", s:2, r:"20", noWeight:true}
      ],
      stretches:[
        "Chest doorway stretch — 30s each side",
        "Shoulder cross-body stretch — 30s each side",
        "Overhead lat stretch — 30s each side"
      ]},
    {d:"Thu", date:"6/18", name:"Easy Run", block:"5:30–7:30 PM", dur:"30–35 min", type:"cardio",
      desc:"30–35 min easy — same feel as Tuesday. No intensity this week.",
      fields:["Distance (mi)","Time","Avg HR"]},
    {d:"Fri", date:"6/19", name:"Full Body — Deadlift Focus", block:"5:30–7:30 PM", dur:"1 hr work", type:"lift",
      warmup:["2–3 min on rower, stairmaster, or erg — easy pace","Cat-cow + hip hinge drill — 10 reps","Bodyweight Romanian deadlift — 1×12"],
      items:[
        {n:"Deadlift", s:4, r:"4", note:"RPE 7 — log top weight"},
        {n:"Front/Goblet Squat", s:3, r:"8"},
        {n:"Incline DB Press", s:3, r:"10"},
        {n:"Pull-ups", s:3, r:"max", repsIn:true, note:"log reps each set"},
        {n:"Plank", s:3, r:"45s", noWeight:true, coreStart:true},
        {n:"Ab Wheel Rollout", s:2, r:"8", noWeight:true},
        {n:"Dead Bug", s:2, r:"10/side", noWeight:true}
      ],
      stretches:[
        "Hamstring stretch — 30s each side",
        "Hip flexor stretch — 30s each side",
        "Thoracic rotation — 10 each side"
      ]},
    {d:"Sat", date:"6/20", name:"Yoga", block:"Morning", dur:"45–60 min", type:"cardio",
      desc:"Focused yoga — hip openers, hamstrings, thoracic spine, shoulders. Restorative or flow both work. Active recovery, not a workout.",
      fields:["Duration","Style (flow / restorative / hatha)"]},
    {d:"Sun", date:"6/21", name:"Active Recovery + Plan", block:"Morning", dur:"20–25 min jog", type:"cardio",
      desc:"Easy 20–25 min jog, no structure. Tonight: tap Export log, open the project on your laptop and say \"plan next week.\"",
      fields:["Distance (mi)","Time"]}
  ]
};
// ===================================================================================

// Templates appended via "Add workout"
const TEMPLATES = {
  strength: () => ({
    id: "ex"+Date.now(), type:"lift", name:"Extra Strength", block:"Added session", dur:"",
    warmup:["2–3 min easy cardio (row / bike / incline walk)"],
    items:[
      {n:"", s:3, r:"10", editable:true},
      {n:"", s:3, r:"10", editable:true},
      {n:"", s:3, r:"12", editable:true}
    ],
    stretches:["Stretch the muscles you worked — ~2 min total"],
    st:{ sets:{}, warmup:{}, stretches:{}, custom:[] }
  }),
  running: () => ({
    id: "ex"+Date.now(), type:"cardio", name:"Extra Run", block:"Added session", dur:"",
    desc:"Easy run — log distance, time, and how it felt.",
    fields:["Distance (mi)","Time","Avg HR"],
    st:{ fields:{}, done:false }
  })
};

const KEY = "wlog-" + PLAN.weekId;
let mem = {days:{}};
let syncTimer, picking = false;

function loadState(){ try{ const s = localStorage.getItem(KEY); if(s) mem = JSON.parse(s); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }

async function syncDown(){
  try{
    const r = await fetch('/api/' + PLAN.weekId);
    if(!r.ok) return;
    const remote = await r.json();
    if(remote && remote.days && Object.keys(remote.days).length > 0){ mem = remote; saveLocal(); render(); }
  }catch(e){}
}
async function syncUp(){
  try{ await fetch('/api/' + PLAN.weekId, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(mem)}); }catch(e){}
}
function save(){ saveLocal(); clearTimeout(syncTimer); syncTimer = setTimeout(syncUp, 600); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ syncDown(); loadWeight(); } });

function todayIdx(){
  const start = new Date(PLAN.start + "T00:00:00");
  const diff = Math.floor((new Date() - start) / 86400000);
  return Math.min(6, Math.max(0, diff));
}
let cur = todayIdx();

function dayState(i){
  const d = mem.days[i] || (mem.days[i] = {});
  d.sets = d.sets || {}; d.fields = d.fields || {}; d.warmup = d.warmup || {}; d.stretches = d.stretches || {};
  d.custom = d.custom || []; d.extra = d.extra || [];
  if(d.journal == null) d.journal = ""; if(d.feel == null) d.feel = ""; if(d.done == null) d.done = false;
  return d;
}

// All sessions for a day = primary + extras
function sessionsFor(i){
  const st = dayState(i);
  const list = [{def: PLAN.days[i], st, kind:"primary"}];
  (st.extra||[]).forEach(ex=>{
    ex.st = ex.st || {}; ex.st.sets=ex.st.sets||{}; ex.st.warmup=ex.st.warmup||{};
    ex.st.stretches=ex.st.stretches||{}; ex.st.custom=ex.st.custom||[]; ex.st.fields=ex.st.fields||{};
    list.push({def: ex, st: ex.st, kind:"extra", id: ex.id});
  });
  return list;
}

// ---- progress / stats ----
function liftUnits(def, st){
  let total=0, done=0;
  (def.warmup||[]).forEach((_,wi)=>{ total++; if(st.warmup[wi]) done++; });
  (def.items||[]).forEach((it,ii)=>{ for(let s=0;s<it.s;s++){ total++; if((st.sets[ii+"-"+s]||{}).done) done++; } });
  (st.custom||[]).forEach(ci=> (ci.sets||[]).forEach(se=>{ total++; if(se.done) done++; }));
  (def.stretches||[]).forEach((_,si)=>{ total++; if(st.stretches[si]) done++; });
  return {total, done};
}
function sessionUnits(s){
  if(s.def.type==="lift") return liftUnits(s.def, s.st);
  // cardio: count = number of fields with a value + the done flag
  let total=1, done = s.st.done?1:0;
  return {total, done};
}
function dayProgress(i){
  let total=0, done=0;
  sessionsFor(i).forEach(s=>{ const u=sessionUnits(s); total+=u.total; done+=u.done; });
  return {total, done, pct: total? Math.round(done/total*100):0};
}
function dayComplete(i){ const p=dayProgress(i); return p.total>0 && p.done===p.total; }

function volume(def, st){
  let v=0;
  (def.items||[]).forEach((it,ii)=>{ if(it.noWeight) return; for(let s=0;s<it.s;s++){ const e=st.sets[ii+"-"+s]||{}; const w=parseFloat(e.w); const reps=parseFloat(e.r)|| (parseInt(it.r)||0); if(w>0 && reps>0) v+=w*reps; } });
  (st.custom||[]).forEach(ci=> (ci.sets||[]).forEach(se=>{ const w=parseFloat(se.w), reps=parseFloat(se.r); if(w>0&&reps>0) v+=w*reps; }));
  return v;
}

function esc(s){ return (s==null?"":(""+s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

// ---- render ----
function renderTabs(){
  const t = document.getElementById("tabs"); t.innerHTML = "";
  PLAN.days.forEach((day,i)=>{
    const b = document.createElement("button");
    b.className = "tab" + (i===cur?" active":"") + (dayComplete(i)?" done":"");
    b.innerHTML = `<span class="dn">${day.d}</span><span class="dt">${day.date}</span><br><span class="ring"></span>`;
    b.onclick = ()=>{ cur=i; picking=false; render(); };
    t.appendChild(b);
  });
}

function kindMeta(type){
  return type==="lift" ? {ico:"🏋️", label:"Strength"} : {ico:"🏃", label:"Run / Cardio"};
}

function render(){
  renderTabs();
  document.getElementById("hTitle").textContent = PLAN.title;
  document.getElementById("hSub").textContent = PLAN.subtitle;
  const sessions = sessionsFor(cur);
  const primary = sessions[0];
  const day = primary.def, st = primary.st;
  const km = kindMeta(day.type);
  const prog = dayProgress(cur);

  let h = "";

  // Activity header for primary session
  h += `<div class="ahead">
    <span class="kind"><span class="ico">${km.ico}</span>${km.label}${km.label?'':''}</span>
    <h1>${esc(day.name)}</h1>
    <div class="when">${esc(day.d)} ${esc(day.date)} · ${esc(day.block)}${day.dur?` · ${esc(day.dur)}`:""}</div>`;
  if(day.desc) h += `<div class="desc">${esc(day.desc)}</div>`;
  h += renderStats(primary);
  h += `<div class="pbar${prog.pct===100?" full":""}"><span style="width:${prog.pct}%"></span></div>
    <div class="pcap"><span>${prog.done} of ${prog.total} done</span><span>${prog.pct}%</span></div>
  </div>`;

  // Flow stepper (primary session phases)
  if(day.type==="lift") h += renderFlow(day, st);

  // Primary session body
  h += renderSessionBody(day, st, 0);

  // Extra sessions
  sessions.slice(1).forEach((s, idx)=>{
    const sx = idx+1;
    const skm = kindMeta(s.def.type);
    h += `<div class="extra-head"><span class="et">${skm.ico} ${esc(s.def.name)}</span>
      <button class="rm" data-rmextra="${s.id}">Remove ✕</button></div>`;
    if(s.def.type==="lift") h += renderFlow(s.def, s.st);
    if(s.def.desc) h += `<div class="card" style="color:var(--dim);font-size:14px;line-height:1.5">${esc(s.def.desc)}</div>`;
    h += renderSessionBody(s.def, s.st, sx);
  });

  // Add workout
  h += `<div class="addworkout-wrap">`;
  if(!picking){
    h += `<button class="addworkout" data-addworkout>＋ Add another workout</button>`;
  }else{
    h += `<div class="picker">
      <button data-newworkout="strength"><span class="pi">🏋️</span>Strength</button>
      <button data-newworkout="running"><span class="pi">🏃</span>Running</button>
      <button class="cancel" data-cancelpick>Cancel</button>
    </div>`;
  }
  h += `</div>`;

  // Journal + feel (day-level, on primary)
  h += `<div class="jr"><div class="seclabel"><span class="txt" style="color:var(--text)">How did the day feel?</span><span class="bar"></span></div>
    <div class="feel">`;
  ["Great","Good","OK","Rough"].forEach(f=>{ h += `<button data-feel="${f}" class="${st.feel===f?"on":""}">${f}</button>`; });
  h += `</div><textarea placeholder="Journal — what happened, what hurt, what felt strong…" data-j="1">${esc(st.journal)}</textarea></div>`;

  document.getElementById("content").innerHTML = h;
  attachHandlers();
}

function renderStats(s){
  const def=s.def, st=s.st;
  if(def.type==="lift"){
    const u = liftUnits(def, st);
    const vol = volume(def, st);
    const exCount = (def.items||[]).length + (st.custom||[]).length;
    return `<div class="stats">
      <div class="stat"><div class="v">${exCount}</div><div class="k">Exercises</div></div>
      <div class="stat"><div class="v">${u.done}<small>/${u.total}</small></div><div class="k">Sets done</div></div>
      <div class="stat"><div class="v">${vol? (vol>=1000? (vol/1000).toFixed(1)+'k':vol):'—'}<small>${vol?' lb':''}</small></div><div class="k">Volume</div></div>
    </div>`;
  }
  // cardio: show first up-to-3 fields as stats
  const fields = (def.fields||[]).slice(0,3);
  let cells = fields.map(f=>{
    const val = (st.fields&&st.fields[f]) ? st.fields[f] : "—";
    const short = f.replace(/\s*\(.*\)/,"");
    return `<div class="stat"><div class="v" style="font-size:16px">${esc(val)}</div><div class="k">${esc(short)}</div></div>`;
  }).join("");
  return `<div class="stats">${cells}</div>`;
}

function renderFlow(def, st){
  const w = {t:(def.warmup||[]).length, d:(def.warmup||[]).filter((_,i)=>st.warmup[i]).length};
  let workT=0, workD=0, coreT=0, coreD=0, started=false;
  (def.items||[]).forEach((it,ii)=>{
    if(it.coreStart) started=true;
    for(let s=0;s<it.s;s++){ const done=(st.sets[ii+"-"+s]||{}).done?1:0;
      if(started){coreT++; coreD+=done;} else {workT++; workD+=done;} }
  });
  (st.custom||[]).forEach(ci=>(ci.sets||[]).forEach(se=>{ workT++; if(se.done) workD++; }));
  const c = {t:(def.stretches||[]).length, d:(def.stretches||[]).filter((_,i)=>st.stretches[i]).length};
  const steps = [
    {ph:"Warm-up", t:w.t, d:w.d},
    {ph:"Workout", t:workT, d:workD},
  ];
  if(coreT) steps.push({ph:"Core", t:coreT, d:coreD});
  steps.push({ph:"Cool-down", t:c.t, d:c.d});
  // active = first phase not complete
  let activeI = steps.findIndex(s=> s.t>0 && s.d<s.t);
  let html = `<div class="flow">`;
  steps.forEach((s,i)=>{
    const done = s.t>0 && s.d===s.t;
    const cls = done?"done":(i===activeI?"active":"");
    html += `<div class="step ${cls}"><div class="ph">${s.ph}</div><div class="ct">${s.d}/${s.t}</div></div>`;
  });
  html += `</div>`;
  return html;
}

// Render warmup, exercises (work+core), custom, stretches OR cardio fields
function renderSessionBody(def, st, sx){
  if(def.type==="cardio"){
    let h = `<div class="card ex">`;
    (def.fields||[]).forEach(f=>{
      h += `<div class="fieldrow"><span class="flbl">${esc(f)}</span><input type="text" value="${esc((st.fields||{})[f]||"")}" data-sx="${sx}" data-f="${esc(f)}"></div>`;
    });
    h += `<button class="bigdone${st.done?" on":""}" data-sx="${sx}" data-done="1">${st.done?"Completed ✓":"Mark complete"}</button></div>`;
    return h;
  }

  let h = "";
  // Warm-up
  if((def.warmup||[]).length){
    h += secLabel("warm","Warm-up", `${(def.warmup).filter((_,i)=>st.warmup[i]).length}/${def.warmup.length}`);
    h += `<div class="card">`;
    def.warmup.forEach((w,wi)=>{
      h += `<div class="setrow"><button class="chk${st.warmup[wi]?" on":""}" data-sx="${sx}" data-wk="${wi}">✓</button><span class="ilbl${st.warmup[wi]?" dim":""}">${esc(w)}</span></div>`;
    });
    h += `</div>`;
  }

  // Work + core
  let inCore=false, openedWork=false;
  (def.items||[]).forEach((it,ii)=>{
    if(it.coreStart && !inCore){ inCore=true;
      const coreItems = def.items.filter(x=>def.items.indexOf(x)>=ii);
      h += secLabel("core","Core Finisher",""); }
    if(!inCore && !openedWork){ openedWork=true;
      h += secLabel("work","The Workout",""); }
    h += renderExercise(it, st, sx, ii, false);
  });

  // Custom (quick-added) exercises — part of workout
  (st.custom||[]).forEach((ci,ci_i)=>{
    if(!openedWork && !inCore){ openedWork=true; h += secLabel("work","The Workout",""); }
    h += renderCustom(ci, sx, ci_i);
  });

  // Add-exercise (lifts only)
  h += `<button class="addex" data-sx="${sx}" data-addex="1">＋ Add exercise</button>`;

  // Stretches / cool-down
  if((def.stretches||[]).length){
    h += secLabel("cool","Cool-down · Stretches", `${(def.stretches).filter((_,i)=>st.stretches[i]).length}/${def.stretches.length}`);
    h += `<div class="card">`;
    def.stretches.forEach((sN,si)=>{
      h += `<div class="setrow"><button class="chk${st.stretches[si]?" on":""}" data-sx="${sx}" data-sk="${si}">✓</button><span class="ilbl${st.stretches[si]?" dim":""}">${esc(sN)}</span></div>`;
    });
    h += `</div>`;
  }
  return h;
}

function secLabel(cls, txt, cnt){
  return `<div class="seclabel ${cls}"><span class="txt">${txt}</span>${cnt?`<span class="cnt">${cnt}</span>`:""}<span class="bar"></span></div>`;
}

function renderExercise(it, st, sx, ii, isCustom){
  let h = `<div class="card ex"><div class="top">`;
  if(it.editable){
    h += `<input class="nameinput" placeholder="Exercise name" value="${esc(it.n)}" data-sx="${sx}" data-iname="${ii}">`;
  }else{
    h += `<span class="name">${esc(it.n)}</span><span class="scheme">${it.s}×${esc(it.r)}</span>`;
  }
  h += `</div>`;
  if(it.note) h += `<div class="note">${esc(it.note)}</div>`;
  for(let s=0;s<it.s;s++){
    const k = ii+"-"+s, v = st.sets[k]||{};
    h += `<div class="setrow"><button class="chk${v.done?" on":""}" data-sx="${sx}" data-k="${k}">✓</button><span class="slbl">Set ${s+1}</span>`;
    if(!it.noWeight) h += `<input class="ni" type="number" inputmode="decimal" placeholder="wt" value="${esc(v.w||"")}" data-sx="${sx}" data-w="${k}"><span class="unit">lb</span>`;
    if(it.repsIn) h += `<input class="ni" type="number" inputmode="numeric" placeholder="reps" value="${esc(v.r||"")}" data-sx="${sx}" data-r="${k}"><span class="unit">reps</span>`;
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}

function renderCustom(ci, sx, ci_i){
  ci.sets = ci.sets || [{}];
  let h = `<div class="card ex"><div class="top">
    <input class="nameinput" placeholder="Exercise name" value="${esc(ci.n||"")}" data-sx="${sx}" data-cn="${ci_i}">
  </div>`;
  ci.sets.forEach((se,si)=>{
    h += `<div class="setrow"><button class="chk${se.done?" on":""}" data-sx="${sx}" data-cchk="${ci_i}.${si}">✓</button><span class="slbl">Set ${si+1}</span>
      <input class="ni" type="number" inputmode="decimal" placeholder="wt" value="${esc(se.w||"")}" data-sx="${sx}" data-cw="${ci_i}.${si}"><span class="unit">lb</span>
      <input class="ni" type="number" inputmode="numeric" placeholder="reps" value="${esc(se.r||"")}" data-sx="${sx}" data-cr="${ci_i}.${si}"><span class="unit">reps</span>
    </div>`;
  });
  h += `<div class="setminis">
    <button class="minibtn" data-sx="${sx}" data-caddset="${ci_i}">＋ Set</button>
    <button class="minibtn warn" data-sx="${sx}" data-cdel="${ci_i}">Remove exercise</button>
  </div></div>`;
  return h;
}

// ---- handlers ----
function stForSx(sx){ return sessionsFor(cur)[sx].st; }

function attachHandlers(){
  const c = document.getElementById("content");
  const q = sel => c.querySelectorAll(sel);

  q("[data-k]").forEach(b=> b.onclick = ()=>{ const st=stForSx(+b.dataset.sx); const v=st.sets[b.dataset.k]||(st.sets[b.dataset.k]={}); v.done=!v.done; save(); render(); });
  q("[data-w]").forEach(inp=> inp.oninput = ()=>{ const st=stForSx(+inp.dataset.sx); const v=st.sets[inp.dataset.w]||(st.sets[inp.dataset.w]={}); v.w=inp.value; save(); });
  q("[data-r]").forEach(inp=> inp.oninput = ()=>{ const st=stForSx(+inp.dataset.sx); const v=st.sets[inp.dataset.r]||(st.sets[inp.dataset.r]={}); v.r=inp.value; save(); });
  q("[data-wk]").forEach(b=> b.onclick = ()=>{ const st=stForSx(+b.dataset.sx); st.warmup[b.dataset.wk]=!st.warmup[b.dataset.wk]; save(); render(); });
  q("[data-sk]").forEach(b=> b.onclick = ()=>{ const st=stForSx(+b.dataset.sx); st.stretches[b.dataset.sk]=!st.stretches[b.dataset.sk]; save(); render(); });
  q("[data-iname]").forEach(inp=> inp.oninput = ()=>{ const s=sessionsFor(cur)[+inp.dataset.sx]; s.def.items[+inp.dataset.iname].n=inp.value; save(); });

  // custom
  q("[data-cn]").forEach(inp=> inp.oninput = ()=>{ stForSx(+inp.dataset.sx).custom[+inp.dataset.cn].n=inp.value; save(); });
  q("[data-cchk]").forEach(b=> b.onclick = ()=>{ const [ci,si]=b.dataset.cchk.split("."); const se=stForSx(+b.dataset.sx).custom[+ci].sets[+si]; se.done=!se.done; save(); render(); });
  q("[data-cw]").forEach(inp=> inp.oninput = ()=>{ const [ci,si]=inp.dataset.cw.split("."); stForSx(+inp.dataset.sx).custom[+ci].sets[+si].w=inp.value; save(); });
  q("[data-cr]").forEach(inp=> inp.oninput = ()=>{ const [ci,si]=inp.dataset.cr.split("."); stForSx(+inp.dataset.sx).custom[+ci].sets[+si].r=inp.value; save(); });
  q("[data-caddset]").forEach(b=> b.onclick = ()=>{ stForSx(+b.dataset.sx).custom[+b.dataset.caddset].sets.push({}); save(); render(); });
  q("[data-cdel]").forEach(b=> b.onclick = ()=>{ stForSx(+b.dataset.sx).custom.splice(+b.dataset.cdel,1); save(); render(); });
  q("[data-addex]").forEach(b=> b.onclick = ()=>{ stForSx(+b.dataset.sx).custom.push({n:"", sets:[{},{},{}]}); save(); render(); });

  // cardio
  q("[data-f]").forEach(inp=> inp.oninput = ()=>{ const st=stForSx(+inp.dataset.sx); st.fields=st.fields||{}; st.fields[inp.dataset.f]=inp.value; save(); });
  q("[data-done]").forEach(b=> b.onclick = ()=>{ const st=stForSx(+b.dataset.sx); st.done=!st.done; save(); render(); });

  // add / remove workout
  const aw = c.querySelector("[data-addworkout]"); if(aw) aw.onclick = ()=>{ picking=true; render(); };
  const cp = c.querySelector("[data-cancelpick]"); if(cp) cp.onclick = ()=>{ picking=false; render(); };
  q("[data-newworkout]").forEach(b=> b.onclick = ()=>{ dayState(cur).extra.push(TEMPLATES[b.dataset.newworkout]()); picking=false; save(); render(); });
  q("[data-rmextra]").forEach(b=> b.onclick = ()=>{ const st=dayState(cur); st.extra=st.extra.filter(e=>e.id!==b.dataset.rmextra); save(); render(); });

  // journal / feel
  q("[data-feel]").forEach(b=> b.onclick = ()=>{ dayState(cur).feel=b.dataset.feel; save(); render(); });
  const j = c.querySelector("[data-j]"); if(j) j.oninput = ()=>{ dayState(cur).journal=j.value; save(); };
}

// ---- weight indicator ----
async function loadWeight(){
  let entries=[];
  try{ const s=localStorage.getItem('weight-log'); if(s) entries=JSON.parse(s);}catch(e){}
  try{ const r=await fetch('/api/weight-log'); if(r.ok){ const d=await r.json(); if(d&&Array.isArray(d.entries)&&d.entries.length) entries=d.entries; } }catch(e){}
  renderWeightChip(entries);
}
function renderWeightChip(entries){
  const valEl=document.getElementById('wval'), trEl=document.getElementById('wtrend'), spEl=document.getElementById('wspark');
  if(!entries.length){ valEl.textContent="—"; trEl.textContent="Log weight"; trEl.className="wtrend flat"; spEl.innerHTML=""; return; }
  const sorted=[...entries].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=sorted[sorted.length-1];
  valEl.textContent=latest.weight.toFixed(1);
  // trend vs ~30d ago (or earliest)
  const cutoff=new Date(latest.date); cutoff.setDate(cutoff.getDate()-30);
  const cutStr=cutoff.toISOString().slice(0,10);
  let older=null; for(const e of sorted){ if(e.date<=cutStr) older=e; }
  if(!older) older=sorted[0];
  const diff=latest.weight-older.weight;
  const sign=diff>0?"+":"";
  trEl.textContent=`${sign}${diff.toFixed(1)} lb · 30d`;
  trEl.className="wtrend "+(diff<-0.05?"down":diff>0.05?"up":"flat");
  spEl.innerHTML=sparkline(sorted.slice(-30).map(e=>e.weight), diff);
}
function sparkline(vals, diff){
  if(vals.length<2) return "";
  const w=52,h=22,p=2;
  const min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||1;
  const pts=vals.map((v,i)=>{ const x=p+i/(vals.length-1)*(w-2*p); const y=h-p-((v-min)/range)*(h-2*p); return `${x.toFixed(1)},${y.toFixed(1)}`; });
  const col=diff<-0.05?"var(--green)":diff>0.05?"var(--amber)":"var(--dim)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${pts.join(" ")}"/></svg>`;
}

// ---- export log ----
function buildLog(){
  let md = `# Log — ${PLAN.title} (${PLAN.weekId})\n\n`;
  PLAN.days.forEach((day,i)=>{
    const sessions = sessionsFor(i);
    const st = sessions[0].st;
    md += `## ${day.d} ${day.date} — ${day.name}\n`;
    sessions.forEach((s,si)=>{
      if(si>0) md += `\n**+ ${s.def.name}**\n`;
      md += logSession(s.def, s.st);
    });
    if(st.feel) md += `- Feel: ${st.feel}\n`;
    if(st.journal) md += `- Journal: ${st.journal}\n`;
    md += `\n`;
  });
  return md;
}
function logSession(def, st){
  let md = "";
  if(def.type==="lift"){
    if((def.warmup||[]).length){ const d=def.warmup.filter((_,wi)=>st.warmup[wi]).length; md+=`- Warmup: ${d}/${def.warmup.length} done\n`; }
    let inCore=false;
    (def.items||[]).forEach((it,ii)=>{
      if(it.coreStart && !inCore){ md+=`**Core Finisher**\n`; inCore=true; }
      const sets=[];
      for(let s=0;s<it.s;s++){ const v=st.sets[ii+"-"+s]||{}; if(v.done||v.w||v.r) sets.push(`${it.noWeight?"":(v.w||"?")}${it.repsIn&&v.r?"×"+v.r:""}${v.done?" ✓":" (—)"}`); }
      const nm = it.n || "(unnamed)";
      md += sets.length ? `- ${nm} (${it.s}×${it.r}): ${sets.join(", ")}\n` : `- ${nm} (${it.s}×${it.r}): skipped\n`;
    });
    (st.custom||[]).forEach(ci=>{
      const sets=(ci.sets||[]).filter(se=>se.done||se.w||se.r).map(se=>`${se.w||"?"}${se.r?"×"+se.r:""}${se.done?" ✓":""}`);
      md += `- ${ci.n||"(added exercise)"}: ${sets.length?sets.join(", "):"logged"}\n`;
    });
    if((def.stretches||[]).length){ const d=def.stretches.filter((_,si)=>st.stretches[si]).length; md+=`- Stretches: ${d}/${def.stretches.length} done\n`; }
  }else{
    md += st.done ? `- Completed ✓\n` : `- Not marked complete\n`;
    (def.fields||[]).forEach(f=>{ if((st.fields||{})[f]) md+=`- ${f}: ${st.fields[f]}\n`; });
  }
  return md;
}

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

document.getElementById("copyBtn").onclick = async ()=>{
  const md=buildLog();
  try{ await navigator.clipboard.writeText(md); toast("Log copied — paste to Claude"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=md; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Log copied"); }
};
document.getElementById("exportBtn").onclick = ()=>{
  const md=buildLog(), fname=`log-${PLAN.weekId}.md`, blob=new Blob([md],{type:"text/markdown"});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[new File([blob],fname)]})){
    navigator.share({files:[new File([blob],fname,{type:"text/markdown"})], title:fname}).catch(()=>{});
  }else{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); toast("Downloaded — move to logs/"); }
};

loadState();
render();
syncDown();
loadWeight();
</script>
