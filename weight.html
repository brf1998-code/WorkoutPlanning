<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<title>Weight</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f1f2f4; --card:#ffffff; --card2:#f4f5f7; --line:#e4e6ea;
    --text:#1b1d22; --dim:#73767e; --faint:#a6a9b0;
    --orange:#fc4c02; --green:#1aa463; --amber:#e08a00;
    --shadow:0 1px 2px rgba(20,22,28,.06), 0 1px 8px rgba(20,22,28,.04);
    --shadow-lg:0 4px 18px rgba(20,22,28,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#171b22; --card2:#1f242e; --line:#2a313d;
      --text:#eaeef3; --dim:#8b95a5; --faint:#5b6473;
      --orange:#ff5b1f; --green:#3ecf8e; --amber:#f5b14d;
      --shadow:none; --shadow-lg:0 6px 22px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:40px; -webkit-font-smoothing:antialiased}
  .topbar{position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line);
    padding:12px 14px; display:flex; align-items:center; gap:12px}
  .topbar a{color:var(--orange); text-decoration:none; font-size:14px; font-weight:700; padding:6px 10px;
    border:1px solid var(--line); border-radius:10px}
  .topbar h1{margin:0; font-size:17px; font-weight:800; flex:1}
  .wrap{padding:14px}

  .latest{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:18px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between}
  .latest .big{font-size:42px; font-weight:800; line-height:1; letter-spacing:-.02em}
  .latest .unit{font-size:16px; color:var(--dim); margin-left:4px; font-weight:700}
  .latest .trend{font-size:14px; margin-top:6px; font-weight:700}
  .trend.down{color:var(--green)} .trend.up{color:var(--amber)} .trend.flat{color:var(--dim)}
  .latest .date{text-align:right; color:var(--dim); font-size:12px; font-weight:600}

  .chart-card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .filters{display:flex; gap:8px; margin-bottom:14px}
  .filters button{flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--card2);
    color:var(--dim); font-size:13px; font-weight:800}
  .filters button.active{background:var(--orange); color:#fff; border-color:var(--orange)}
  .chart-wrap{position:relative; height:200px}

  .entry-card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .entry-card h3{margin:0 0 12px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--dim)}
  .entry-row{display:flex; gap:8px; align-items:center}
  .entry-row input{flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:11px 12px; font-size:16px; outline:none}
  .entry-row input:focus{border-color:var(--orange)}
  .entry-row button{padding:11px 18px; border-radius:10px; border:none; background:var(--orange); color:#fff;
    font-size:15px; font-weight:800; white-space:nowrap}

  .history{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:12px}
  .history h3{margin:0; padding:14px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--dim); border-bottom:1px solid var(--line)}
  .entry-item{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line)}
  .entry-item:last-child{border-bottom:none}
  .entry-item .date{color:var(--dim); font-size:13px; font-weight:600}
  .entry-item .wt{font-weight:800; font-size:15px}
  .entry-item .del{color:var(--faint); font-size:20px; padding:4px 8px; border:none; background:none}
  .empty{color:var(--dim); font-size:14px; text-align:center; padding:24px; display:none}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--card);
    padding:10px 16px; border-radius:11px; font-size:14px; font-weight:700; opacity:0; transition:opacity .25s;
    pointer-events:none; z-index:20; box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← This Week</a>
  <h1>Weight</h1>
</div>
<div class="wrap">

  <div class="latest" id="latestCard">
    <div>
      <div><span class="big" id="latestWt">—</span><span class="unit">lb</span></div>
      <div class="trend flat" id="trendLine">No entries yet</div>
    </div>
    <div class="date" id="latestDate"></div>
  </div>

  <div class="chart-card">
    <div class="filters">
      <button onclick="setRange(7)" id="btn7">7D</button>
      <button onclick="setRange(30)" id="btn30" class="active">30D</button>
      <button onclick="setRange(180)" id="btn180">6M</button>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="entry-card">
    <h3>Log weight</h3>
    <div class="entry-row">
      <input type="date" id="dateIn">
      <input type="number" step="0.1" placeholder="lbs" id="wtIn" inputmode="decimal">
      <button onclick="addEntry()">Log</button>
    </div>
  </div>

  <div class="history">
    <h3>History</h3>
    <div class="empty" id="emptyMsg">No entries yet — log your first weight above.</div>
    <div id="historyList"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'weight-log';
let entries = [];
let chart, activeRange = 30, syncTimer;

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s) entries=JSON.parse(s);}catch(e){} }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(entries)); }catch(e){} }
async function syncDown(){
  try{ const r=await fetch('/api/'+KEY); if(!r.ok) return; const remote=await r.json();
    if(remote && Array.isArray(remote.entries) && remote.entries.length>0){ entries=remote.entries; saveLocal(); refresh(); }
  }catch(e){}
}
async function syncUp(){ try{ await fetch('/api/'+KEY,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries})}); }catch(e){} }
function save(){ saveLocal(); clearTimeout(syncTimer); syncTimer=setTimeout(syncUp,600); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncDown(); });

function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ const [y,m,day]=d.split('-'); return new Date(y,m-1,day).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function addEntry(){
  const d=document.getElementById('dateIn').value;
  const w=parseFloat(document.getElementById('wtIn').value);
  if(!d || isNaN(w) || w<=0) return toast('Enter a date and weight');
  entries=entries.filter(e=>e.date!==d);
  entries.push({date:d, weight:w});
  entries.sort((a,b)=>a.date.localeCompare(b.date));
  save(); document.getElementById('wtIn').value=''; toast('Logged ✓'); refresh();
}
function deleteEntry(date){ entries=entries.filter(e=>e.date!==date); save(); refresh(); }

function setRange(days){ activeRange=days; ['7','30','180'].forEach(d=>document.getElementById('btn'+d).classList.toggle('active',parseInt(d)===days)); updateChart(); }

function refresh(){ updateLatest(); updateChart(); updateHistory(); }

function updateLatest(){
  const sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date));
  const wt=document.getElementById('latestWt'), tr=document.getElementById('trendLine'), dt=document.getElementById('latestDate');
  if(!sorted.length){ wt.textContent='—'; tr.textContent='No entries yet'; tr.className='trend flat'; dt.textContent=''; return; }
  const latest=sorted[0];
  wt.textContent=latest.weight.toFixed(1); dt.textContent=fmtDate(latest.date);
  const cutoff=new Date(latest.date); cutoff.setDate(cutoff.getDate()-7);
  const cutoffStr=cutoff.toISOString().slice(0,10);
  const older=sorted.find(e=>e.date<=cutoffStr);
  if(older){ const diff=(latest.weight-older.weight).toFixed(1); const sign=diff>0?'+':'';
    tr.textContent=`${sign}${diff} lb vs 7 days ago`; tr.className='trend '+(diff<0?'down':diff>0?'up':'flat'); }
  else { tr.textContent='Need more data for trend'; tr.className='trend flat'; }
}

function updateChart(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-activeRange);
  const cutoffStr=cutoff.toISOString().slice(0,10);
  const filtered=entries.filter(e=>e.date>=cutoffStr).sort((a,b)=>a.date.localeCompare(b.date));
  const labels=filtered.map(e=>fmtDate(e.date)), data=filtered.map(e=>e.weight);
  if(chart) chart.destroy();
  const orange=cssVar('--orange')||'#fc4c02', grid=cssVar('--line')||'#e4e6ea', tick=cssVar('--dim')||'#73767e';
  const ctx=document.getElementById('chart').getContext('2d');
  chart=new Chart(ctx,{ type:'line',
    data:{ labels, datasets:[{ data, borderColor:orange, backgroundColor:'rgba(252,76,2,0.10)',
      pointBackgroundColor:orange, pointRadius:data.length>30?2:4, pointHoverRadius:6, fill:true, tension:0.3, borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>ctx.parsed.y.toFixed(1)+' lb' } } },
      scales:{
        x:{ grid:{color:grid}, ticks:{color:tick, maxTicksLimit:6, font:{size:11}} },
        y:{ grid:{color:grid}, ticks:{color:tick, font:{size:11}, callback:v=>v+' lb'},
          suggestedMin:data.length?Math.min(...data)-3:150, suggestedMax:data.length?Math.max(...data)+3:200 }
      }}
  });
}

function updateHistory(){
  const list=document.getElementById('historyList'), empty=document.getElementById('emptyMsg');
  const sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  empty.style.display=sorted.length?'none':'block';
  list.innerHTML=sorted.map((e,i)=>{
    const prev=sorted[i+1]; const diff=prev?(e.weight-prev.weight):null;
    const diffStr=diff!==null?` <span style="color:${diff<0?'var(--green)':diff>0?'var(--amber)':'var(--dim)'}; font-size:12px; font-weight:700">${diff>0?'+':''}${diff.toFixed(1)}</span>`:'';
    return `<div class="entry-item"><span class="date">${fmtDate(e.date)}</span><span class="wt">${e.weight.toFixed(1)} lb${diffStr}</span><button class="del" onclick="deleteEntry('${e.date}')">×</button></div>`;
  }).join('');
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

document.getElementById('dateIn').value=today();
loadLocal(); refresh(); syncDown();
</script>
</body>
</html>
