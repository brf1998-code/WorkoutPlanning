<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Weight Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0e1116; --card:#1a1f27; --card2:#222834; --line:#2c3442;
    --text:#e8ecf1; --dim:#8b95a5; --accent:#4f9cf9; --green:#3ecf8e; --amber:#f5b14d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:40px}
  header{padding:16px; display:flex; align-items:center; gap:12px}
  header a{color:var(--accent); text-decoration:none; font-size:14px; padding:6px 10px; border:1px solid var(--line); border-radius:8px}
  header h1{margin:0; font-size:18px; flex:1}
  .wrap{padding:0 16px}
  .latest{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between}
  .latest .big{font-size:36px; font-weight:700; line-height:1}
  .latest .unit{font-size:16px; color:var(--dim); margin-left:4px}
  .latest .trend{font-size:14px; margin-top:4px}
  .trend.down{color:var(--green)}
  .trend.up{color:var(--amber)}
  .trend.flat{color:var(--dim)}
  .chart-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .filters{display:flex; gap:8px; margin-bottom:14px}
  .filters button{flex:1; padding:8px; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--dim); font-size:13px; font-weight:600}
  .filters button.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .chart-wrap{position:relative; height:200px}
  .entry-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .entry-card h3{margin:0 0 12px; font-size:15px}
  .entry-row{display:flex; gap:8px; align-items:center}
  .entry-row input{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:10px 12px; font-size:16px}
  .entry-row button{padding:10px 18px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-size:15px; font-weight:600; white-space:nowrap}
  .history{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:12px}
  .history h3{margin:0; padding:14px; font-size:15px; border-bottom:1px solid var(--line)}
  .entry-item{display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border-bottom:1px solid var(--line)}
  .entry-item:last-child{border-bottom:none}
  .entry-item .date{color:var(--dim); font-size:13px}
  .entry-item .wt{font-weight:600; font-size:15px}
  .entry-item .del{color:var(--dim); font-size:18px; padding:4px 8px; cursor:pointer; border:none; background:none}
  .empty{color:var(--dim); font-size:14px; text-align:center; padding:24px; display:none}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green); color:#0e1116; padding:9px 16px; border-radius:10px; font-size:14px; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none; z-index:10}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <a href="/">← Workouts</a>
  <h1>Weight Log</h1>
</header>
<div class="wrap">

  <div class="latest" id="latestCard">
    <div>
      <div><span class="big" id="latestWt">—</span><span class="unit">lb</span></div>
      <div class="trend flat" id="trendLine">No entries yet</div>
    </div>
    <div style="text-align:right; color:var(--dim); font-size:12px" id="latestDate"></div>
  </div>

  <div class="chart-card">
    <div class="filters">
      <button onclick="setRange(7)" id="btn7">7D</button>
      <button onclick="setRange(30)" id="btn30" class="active">30D</button>
      <button onclick="setRange(180)" id="btn180">6M</button>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="entry-card">
    <h3>Log weight</h3>
    <div class="entry-row">
      <input type="date" id="dateIn">
      <input type="number" step="0.1" placeholder="lbs" id="wtIn" inputmode="decimal">
      <button onclick="addEntry()">Log</button>
    </div>
  </div>

  <div class="history">
    <h3>History</h3>
    <div class="empty" id="emptyMsg">No entries yet — log your first weight above.</div>
    <div id="historyList"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'weight-log';
let entries = []; // [{date:"2026-06-14", weight:175.5}, ...]
let chart;
let activeRange = 30;
let syncTimer;

// --- Persistence ---
function loadLocal(){
  try{ const s = localStorage.getItem(KEY); if(s) entries = JSON.parse(s); }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(entries)); }catch(e){}
}
async function syncDown(){
  try{
    const r = await fetch('/api/' + KEY);
    if(!r.ok) return;
    const remote = await r.json();
    if(remote && Array.isArray(remote.entries) && remote.entries.length > 0){
      entries = remote.entries; saveLocal(); refresh();
    }
  }catch(e){}
}
async function syncUp(){
  try{ await fetch('/api/' + KEY, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({entries})}); }catch(e){}
}
function save(){
  saveLocal();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncUp, 600);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncDown(); });

// --- Date utils ---
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const [y,m,day] = d.split('-');
  return new Date(y,m-1,day).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function daysAgo(dateStr){
  return Math.floor((new Date(today()) - new Date(dateStr)) / 86400000);
}

// --- Entry actions ---
function addEntry(){
  const d = document.getElementById('dateIn').value;
  const w = parseFloat(document.getElementById('wtIn').value);
  if(!d || isNaN(w) || w <= 0) return toast('Enter a date and weight');
  // Remove existing entry for same date
  entries = entries.filter(e => e.date !== d);
  entries.push({date: d, weight: w});
  entries.sort((a,b) => a.date.localeCompare(b.date));
  save();
  document.getElementById('wtIn').value = '';
  toast('Logged ✓');
  refresh();
}

function deleteEntry(date){
  entries = entries.filter(e => e.date !== date);
  save(); refresh();
}

// --- Range ---
function setRange(days){
  activeRange = days;
  ['7','30','180'].forEach(d => {
    document.getElementById('btn'+d).classList.toggle('active', parseInt(d)===days);
  });
  updateChart();
}

// --- Refresh UI ---
function refresh(){
  updateLatest();
  updateChart();
  updateHistory();
}

function updateLatest(){
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date));
  if(!sorted.length){
    document.getElementById('latestWt').textContent = '—';
    document.getElementById('trendLine').textContent = 'No entries yet';
    document.getElementById('trendLine').className = 'trend flat';
    document.getElementById('latestDate').textContent = '';
    return;
  }
  const latest = sorted[0];
  document.getElementById('latestWt').textContent = latest.weight.toFixed(1);
  document.getElementById('latestDate').textContent = fmtDate(latest.date);

  // Trend vs 7 days ago
  const cutoff = new Date(latest.date);
  cutoff.setDate(cutoff.getDate() - 7);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const older = sorted.find(e => e.date <= cutoffStr);
  const trendEl = document.getElementById('trendLine');
  if(older){
    const diff = (latest.weight - older.weight).toFixed(1);
    const sign = diff > 0 ? '+' : '';
    trendEl.textContent = `${sign}${diff} lb vs 7 days ago`;
    trendEl.className = 'trend ' + (diff < 0 ? 'down' : diff > 0 ? 'up' : 'flat');
  } else {
    trendEl.textContent = 'Need more data for trend';
    trendEl.className = 'trend flat';
  }
}

function updateChart(){
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - activeRange);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const filtered = entries.filter(e => e.date >= cutoffStr).sort((a,b) => a.date.localeCompare(b.date));

  const labels = filtered.map(e => fmtDate(e.date));
  const data = filtered.map(e => e.weight);

  if(chart){ chart.destroy(); }

  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets:[{
        data,
        borderColor: '#4f9cf9',
        backgroundColor: 'rgba(79,156,249,0.08)',
        pointBackgroundColor: '#4f9cf9',
        pointRadius: data.length > 30 ? 2 : 4,
        pointHoverRadius: 6,
        fill: true,
        tension: 0.3,
        borderWidth: 2
      }]
    },
    options:{
      responsive: true,
      maintainAspectRatio: false,
      plugins:{ legend:{display:false}, tooltip:{
        callbacks:{ label: ctx => ctx.parsed.y.toFixed(1) + ' lb' }
      }},
      scales:{
        x:{ grid:{color:'#2c3442'}, ticks:{color:'#8b95a5', maxTicksLimit:6, font:{size:11}} },
        y:{ grid:{color:'#2c3442'}, ticks:{color:'#8b95a5', font:{size:11},
            callback: v => v + ' lb'},
            suggestedMin: data.length ? Math.min(...data) - 3 : 150,
            suggestedMax: data.length ? Math.max(...data) + 3 : 200
        }
      }
    }
  });
}

function updateHistory(){
  const list = document.getElementById('historyList');
  const empty = document.getElementById('emptyMsg');
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 20);
  empty.style.display = sorted.length ? 'none' : 'block';
  list.innerHTML = sorted.map((e,i) => {
    const prev = sorted[i+1];
    const diff = prev ? (e.weight - prev.weight) : null;
    const diffStr = diff !== null ? ` <span style="color:${diff<0?'var(--green)':diff>0?'var(--amber)':'var(--dim)'}; font-size:12px">${diff>0?'+':''}${diff.toFixed(1)}</span>` : '';
    return `<div class="entry-item">
      <span class="date">${fmtDate(e.date)}</span>
      <span class="wt">${e.weight.toFixed(1)} lb${diffStr}</span>
      <button class="del" onclick="deleteEntry('${e.date}')">×</button>
    </div>`;
  }).join('');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// Init
document.getElementById('dateIn').value = today();
loadLocal();
refresh();
syncDown();
</script>
</body>
</html>
